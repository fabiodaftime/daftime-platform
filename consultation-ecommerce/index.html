    <script>
      // Pixel coupé en local (les visites de dev ne polluent pas les stats pub) et dans une iframe.
      window.__dftLocal = /^(localhost|127\.0\.0\.1|\[::1\])$|\.localhost$/.test(location.hostname);
      window.__dftFramed = (function () { try { return window.self !== window.top; } catch (e) { return true; } })();
      // Page /merci : si un lien y arrive avec nom / e-mail en paramètres, on ne garde que les utm_*
      // AVANT le pixel, pour qu'aucune donnée personnelle ne parte chez Meta avec l'adresse de la page.
      (function () {
        if (!/\/merci\/?$/.test(location.pathname)) return;
        try {
          var sp = new URLSearchParams(location.search), keep = new URLSearchParams();
          ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term', 'fbclid'].forEach(function (k) {
            var v = sp.get(k); if (v) keep.set(k, v);
          });
          var q = keep.toString();
          history.replaceState(null, '', location.pathname + (q ? '?' + q : ''));
        } catch (e) { /* noop */ }
      })();
    </script>

    <!-- Meta Pixel Code (même ID que les autres LP) — PageView UNIQUEMENT.
         « Schedule » est envoyé côté serveur (Make → API Conversions Meta). -->
    <script>
      if (!window.__dftLocal && !window.__dftFramed) {

      fbq('init', '2166358790810988');
      fbq('track', 'PageView');
      }
    </script>

    <!-- Microsoft Clarity (heatmaps + rejeux de session, même projet que les autres LP) : pour voir OÙ les

    <script type="text/javascript">

      })(window, document, "clarity", "script", "y2xwgzd5gg");
