name: Edge functions (moteur)

# Tests du moteur à chaque changement, puis déploiement des fonctions PLATFORM-ONLY touchées.
# Backend partagé avec la prod Lovable : liste blanche + verify_jwt figés dans scripts/deploy-edge-functions.mjs.
# Sans le secret SUPABASE_ACCESS_TOKEN, le déploiement est simplement ignoré.
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", "scripts/deploy-edge-functions.mjs", ".github/workflows/edge-functions.yml"]
  pull_request:
    paths: ["supabase/functions/**"]
  workflow_dispatch:
    inputs:
      functions:
        description: "Slugs à déployer (séparés par des espaces)"
        required: true

concurrency: { group: edge-functions, cancel-in-progress: false }

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: Tests du moteur (parsers, fusion, Excel)
        run: npx vitest run supabase/functions/_shared

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Déployer les fonctions modifiées
        if: github.event_name == 'push'
        run: node scripts/deploy-edge-functions.mjs --changed ${{ github.event.before }}
      - name: Déployer les fonctions demandées
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/deploy-edge-functions.mjs ${{ github.event.inputs.functions }}
